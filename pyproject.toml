[project]
name = "ptx"
version = "0.1.0"
description = "Asymmetric prompt transfer: cross-model prompt evaluation matrix"
requires-python = ">=3.11"
dependencies = [
    "datasets>=3.0",
    "pyarrow>=15",
    "pyyaml>=6",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
